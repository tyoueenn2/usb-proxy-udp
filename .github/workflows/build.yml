name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libjsoncpp-dev
      - run: make -j2
      - name: Run tests
        shell: bash
        run: |
          set +e
          make test >test-output.log 2>&1
          status=$?
          cat test-output.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 15 test-output.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=make test failed::$message"
          fi
          exit "$status"
      - name: HID parser sanitizers
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I. tests/protocol_test.cpp -o tests/protocol-test-sanitized
          ./tests/protocol-test-sanitized
