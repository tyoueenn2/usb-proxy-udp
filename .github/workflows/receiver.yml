name: Windows receiver checks
on:
  push:
    paths: ['receiver/**', '.github/workflows/receiver.yml']
  pull_request:
    paths: ['receiver/**', '.github/workflows/receiver.yml']
  workflow_dispatch:
jobs:
  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake --preset windows-tests
      - run: cmake --build --preset windows-tests
      - run: ctest --preset windows-tests
      - run: python tests/integration_test.py build/tests/Release/receiver_headless.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-build-no-tensorrt
          path: receiver/build/tests/Release/*.exe
